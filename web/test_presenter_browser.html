<!doctype html><meta charset="utf-8"><title>Frame presenter browser smoke test</title>
<output id="result">PENDING</output><canvas id="screen"></canvas>
<script type="module">
import {FramePresenter} from './frame_presenter.js';
const out=document.getElementById('result');
try{
  const canvas=document.getElementById('screen');
  let tick=0;
  const p=new FramePresenter(canvas,{mobile:false,now:()=>tick});
  const pixel=new Uint8ClampedArray(240*240*4);
  for(let n=3;n<pixel.length;n+=4)pixel[n]=255;
  pixel[0]=127;
  p.present(pixel,240);
  p.present(pixel,240);
  if(p.metrics().painted!==1||p.metrics().skipped!==1)throw Error('unchanged frame not skipped');
  let ctx=canvas.getContext('2d',{alpha:false,willReadFrequently:true});
  if(ctx.getImageData(0,0,1,1).data[0]!==127)throw Error('canvas pixel mismatch');
  tick=100;pixel[0]=192;p.present(pixel,240);
  if(ctx.getImageData(0,0,1,1).data[0]!==192)throw Error('changed pixel mismatch');
  p.setCompatible(true);
  tick=200;p.present(pixel,240);
  if(!p.image.src.startsWith('data:image/png'))throw Error('compatible PNG missing');
  if(p.image.hidden||!canvas.hidden)throw Error('compatible display visibility');
  out.textContent='PASS: actual browser Canvas and PNG presentation';
}catch(error){out.textContent='FAIL: '+error.message;console.error(error);}
</script>
