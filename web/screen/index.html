<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PALEOTONE second screen</title>
<meta name="theme-color" content="#0b0f0c">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{--page:#0b0f0c;--ink:#33ff66;--edge:#0f5a22}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);font:15px "Share Tech Mono",ui-monospace,Menlo,Consolas,monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
canvas{width:min(94vw,calc(100vh - 90px));aspect-ratio:1;image-rendering:pixelated;background:#000;border:2px solid var(--edge);border-radius:6px}
.bar{display:flex;gap:12px;align-items:center}
button{font:inherit;color:#000;background:var(--ink);border:0;padding:8px 16px;border-radius:4px;cursor:pointer}
button:focus-visible{outline:2px solid #ffb000;outline-offset:2px}
#st{opacity:.8;text-align:center;max-width:90vw}.help{max-width:640px;text-align:center;font-size:12px;line-height:1.5;color:#85ab8a;margin:0 12px}.bar{flex-wrap:wrap;justify-content:center}select{font:inherit;padding:8px;background:#132317;color:#33ff66;max-width:75vw}[hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="s" width="240" height="240" aria-label="FM-1 second screen"></canvas>
<div class="bar"><button id="go">Connect FM-1</button><button id="install" hidden>Install app</button><button id="full">Fullscreen</button></div>
<div class="bar" id="portbar" hidden><label>FM-1 ports <select id="ports"></select></label><button id="use">Connect selected ports</button></div>
<span id="st" role="status" aria-live="polite">Connect your FM-1 with a USB data cable.</span>
<p class="help">Use Chrome or Edge on a computer. Phone support is untested. This display follows the FM-1's controls.<br>
This lightweight view shows parameter cards and menus; it does not yet reproduce every screen graphic.</p>
<script src="./screen.js" defer></script>
</body>
</html>
