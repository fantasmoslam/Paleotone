name: browser audio-priority trial
on:
  push:
    branches: [fix/companion-audio-priority-20261028]
  pull_request:
    branches: [feature/roar-worker-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Display and transport regression checks
        run: |
          node web/test_display_performance.mjs
          node web/test_frame_presenter.mjs
          node web/test_physical_focus.mjs
          node web/test_control_target.mjs
          python3 tests/display_trial_test.py
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Stage trial with existing matching renderer (no firmware build)
        run: |
          python3 web/prepare_display_trial.py published/webapp/screen-roar-worker build/audio-priority-trial
          node web/test_published_companion.mjs build/audio-priority-trial
      - uses: actions/upload-artifact@v4
        with:
          name: paleotone-browser-audio-priority-trial
          path: build/audio-priority-trial/
