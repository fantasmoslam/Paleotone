# PALEOTONE: the website, on GitHub Pages (the gh-pages branch): the browser emulator (the whole firmware in
# WebAssembly, played in the browser), the installer and the editor, as GHOULBOX's site. Runs after every
# firmware build of main, and on request (Actions tab: "Run workflow"). The emulator is checked against the
# native build bit for bit (web/emu/emu_test.mjs) before anything is published; the installer carries the
# package the firmware build put on the build-output branch.
name: website

on:
  workflow_run:
    workflows: [build firmware]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # (the gh-pages branch)

jobs:
  site:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tools
        run: python3 -m pip install pillow==12.3.0 fonttools==4.61.1 numpy==2.5.3

      - name: Second-screen app checks
        run: |
          node web/test_screen_app.mjs
          node web/test_frame_presenter.mjs
          node web/test_screen_router.mjs                       # (the forward to a newer screen page)

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      # Pin the renderer to the already working companion firmware. Do not build it
      # from main or silently replace it with the lightweight screen-state page.
      - name: Working graphics companion source
        uses: actions/checkout@v4
        with:
          ref: 19727a9b3c8a6be817c6aa7d1a63073c093ddd34
          path: graphics-companion

      - name: Build and verify the working graphics companion
        run: |
          cd graphics-companion
          python3 tools/build.py --gen-only
          sh web/emu/build.sh
          mkdir -p build/remote
          cc -O1 -ffp-contract=off -w -Ibuild/gen -Ifirmware/src -o build/remote/remote_test tests/remote_render_test.c -lm
          build/remote/remote_test build/remote/fixture.bin
          node web/test_remote_screen.mjs build/emu/felucca.wasm build/remote/fixture.bin
          node web/test_second_screen.mjs build/emu/felucca.wasm build/remote/fixture.bin
          cd ..
          python3 web/prepare_companion.py graphics-companion/build/emu build/screen-companion 19727a9b3c8a6be817c6aa7d1a63073c093ddd34
          node web/test_published_companion.mjs build/screen-companion

      - name: Generated tables
        run: python3 tools/build.py --gen-only

      - name: Emulator
        run: |
          set -o pipefail
          EMU_PREVIEW=0 sh web/emu/build.sh
          cc -O2 -ffp-contract=off -w -Ibuild/gen -Ifirmware/src -o build/emu/native_check web/emu/native_check.c -lm
          build/emu/native_check build/emu/native.f32
          BENCH_MAX=2 node web/emu/emu_test.mjs build/emu/felucca.wasm build/emu/native.f32

      - name: The package from the firmware build
        run: |
          git fetch origin build-output
          git show origin/build-output:RESULT
          git show origin/build-output:paleotone.fwsc > paleotone.fwsc
          sha256sum paleotone.fwsc

      # The tested releases published beside the main page are restored BEFORE the site is made, so
      # web/make_site.py's webapp/screens.json lists the pages the site really ships (the screen page
      # forwards a visitor whose firmware needs another one). A publish replaces the branch, so
      # anything not restored here is gone.
      - name: Preserve the tested releases published beside the site
        run: |
          git fetch origin gh-pages
          mkdir -p site
          for d in screen-device screen-unified screen-scape screen-dualcore screen-audio-diagnostics screen-audio-hotpath screen-effects-hotpath screen-engine-hotpath screen-saurus-cache screen-usb-buffer screen-midi-trace screen-midi-dispatch; do
            if git cat-file -e "origin/gh-pages:webapp/$d/build.json" 2>/dev/null; then
              git archive origin/gh-pages "webapp/$d" | tar -x -C site
              node web/test_published_companion.mjs "site/webapp/$d"
            else
              echo "site: no webapp/$d on gh-pages; not published this time"
            fi
          done
          # Keep the exact companion for devices already running the SCAPE candidate.
          if git cat-file -e "origin/gh-pages:webapp/scape-preview/build.json" 2>/dev/null; then
            git archive origin/gh-pages webapp/scape-preview | tar -x -C site
            node web/test_published_companion.mjs site/webapp/scape-preview/screen
          fi
          node web/test_device_release.mjs site/webapp/screen-device

      - name: Site
        run: |
          VER=$(git rev-parse --short HEAD)
          python3 web/make_site.py paleotone.fwsc "$VER" site
          node web/test_published_companion.mjs site/webapp/screen
          touch site/.nojekyll

      - name: Publish on gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "site of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
