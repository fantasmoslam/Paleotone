name: NightClaw browser
on:
  push:
    branches: [twrecks-completion, twrecks]
    paths:
      - 'web/nightclaw/**'
      - 'web/emu/amb_web.c'
      - 'host/amb_host.c'
      - 'firmware/src/**'
      - 'assets/fonts/**'
      - 'tools/gen_font.py'
      - 'tools/gen_words.py'
      - 'tests/host/nightclaw_web_test.mjs'
      - '.github/workflows/nightclaw-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: WebAssembly tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emscripten python3-pil python3-fonttools
      - name: Build actual firmware for the browser
        run: sh web/nightclaw/build.sh
      - name: Browser engine and worklet checks
        run: |
          node --check web/nightclaw/player.js
          node --check web/nightclaw/worklet.js
          node tests/host/nightclaw_web_test.mjs build/nightclaw
      - uses: actions/upload-artifact@v4
        with:
          name: nightclaw-browser
          path: build/nightclaw/
