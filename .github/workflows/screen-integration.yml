name: screen integration review
on:
  push:
    branches: [integrate/screen-review-20261028]
  pull_request:
    branches: [fix/companion-audio-priority-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screen-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Page, presenter, transport and routing regressions
        run: |
          node --check web/frame_presenter.js
          node web/test_frame_presenter.mjs
          node web/test_frame_pipeline.mjs
          node web/test_screen_workload.mjs
          node web/test_display_performance.mjs
          node web/test_screen_app.mjs
          node web/test_screen_router.mjs
          node web/test_physical_focus.mjs
          node web/test_control_target.mjs
          python3 tests/companion_package_test.py
          python3 tests/display_trial_test.py
          git diff --check
      - name: Exercise the production preservation step without publishing
        run: python3 tests/site_preservation_test.py
      - name: Install Chrome for actual Canvas and PNG verification
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Browser presentation smoke test
        shell: bash
        run: |
          python3 -m http.server 8765 --directory web >/tmp/paleotone-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/frame_presenter.js >/dev/null; then break; fi
            sleep 1
          done
          "${{ steps.chrome.outputs.chrome-path }}" --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/test_presenter_browser.html > /tmp/paleotone-chrome.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('/tmp/paleotone-chrome.html').read_text()
          match = re.search(r'<output[^>]*id="result"[^>]*>([^<]*)</output>', html)
          actual = match.group(1).strip() if match else 'MISSING'
          print('Browser result:', actual)
          assert actual == 'PASS: actual browser Canvas and PNG presentation', actual
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: paleotone-screen-integration-staging
          path: site/
