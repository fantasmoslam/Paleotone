name: remote screen
on:
  push:
    branches: [feature/paleotone-remote-screen, feature/fm1-physical-screen-focus, feature/paleotone-unified, feature/display-latency, feature/site-installer, feature/scape-garden, feature/usb-buffer-margin, feature/midi-path-trace, fix/editor-updater-dispatch, feature/roar-worker-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Installer diagnostics and interrupted-transfer regression
        run: |
          python3 tests/install_test.py
          python3 tests/companion_package_test.py
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - run: python3 -m pip install pillow==12.3.0 fonttools==4.61.1
      - run: python3 tools/build.py --gen-only
      - name: Physical FM-1 focus gesture
        run: |
          mkdir -p build/remote
          cc -std=c99 -Wall -Wextra -Werror -o build/remote/gesture_test tests/panel_screen_gesture_test.c
          build/remote/gesture_test
          cc -O1 -ffp-contract=off -w -Ibuild/gen -Ifirmware/src -o build/remote/physical_test tests/physical_panel_test.c -lm
          build/remote/physical_test
      - name: SCAPE pages and held-layer navigation
        run: |
          cc -O1 -w -Ibuild/gen -Ifirmware/src -o build/remote/scape_nav tests/scape_navigation_test.c -lm
          build/remote/scape_nav
          cc -O1 -w -DFELUCCA_FM4=1 -Ibuild/gen -Ifirmware/src -o build/remote/scape_nav_fm4 tests/scape_navigation_test.c -lm
          build/remote/scape_nav_fm4
      - name: Shared SCAPE director and project compatibility
        run: |
          cc -O2 -ffp-contract=off -w -Ibuild/gen -Ifirmware/src -o build/remote/director_test tests/scape_director_test.c -lm
          build/remote/director_test
          cc -O2 -ffp-contract=off -w -Ibuild/gen -Ifirmware/src -o build/remote/dream_test tests/dream_test.c -lm
          build/remote/dream_test
          cc -O2 -ffp-contract=off -w -Ibuild/gen -Ifirmware/src -o build/remote/scape_test tests/scape_test.c -lm
          build/remote/scape_test
      - name: Combined SCAPE and SAURUS scene
        run: |
          cc -O1 -ffp-contract=off -w -Ibuild/gen -Ifirmware/src -o build/remote/unified_test tests/unified_scene_test.c -lm
          build/remote/unified_test
      - name: Retired SLICER and preserved performance effects
        run: |
          cc -O2 -ffp-contract=off -w -Ibuild/gen -Ifirmware/src -o build/remote/sound14_test tests/sound14_test.c -lm
          build/remote/sound14_test
          cc -O2 -ffp-contract=off -w -Ibuild/gen -Ifirmware/src -o build/remote/perform_test tests/perform_test.c -lm
          build/remote/perform_test
      - name: Busy MIDI queue regression
        run: |
          mkdir -p build/remote
          cc -std=c99 -Wall -Wextra -Werror -o build/remote/queue_test tests/remote_queue_test.c
          build/remote/queue_test
          cc -std=c99 -Wall -Wextra -Werror -Ifirmware/src -o build/remote/codec_test tests/remote_codec_test.c
          build/remote/codec_test build/remote/codec.bin
      - name: Native renderer and original-screen fidelity
        run: |
          mkdir -p build/remote
          cc -O1 -ffp-contract=off -w -Ibuild/gen -Ifirmware/src -o build/remote/remote_test tests/remote_render_test.c -lm
          build/remote/remote_test build/remote/fixture.bin
      - name: WASM renderer and MIDI protocol
        run: |
          sh web/emu/build.sh
          node web/test_remote_screen.mjs build/emu/felucca.wasm build/remote/fixture.bin
          node web/test_second_screen.mjs build/emu/felucca.wasm build/remote/fixture.bin
          node web/test_physical_focus.mjs
          node web/test_display_paint.mjs build/emu/felucca.wasm build/remote/fixture.bin
          node web/test_remote_compression.mjs build/remote/fixture.bin.compact build/remote/codec.bin
          node web/test_display_performance.mjs
          node web/test_frame_presenter.mjs
          node web/test_control_target.mjs
          node web/test_control_widget.mjs
      - name: Browser instrument fidelity and site flow
        run: |
          cc -O2 -ffp-contract=off -w -Ibuild/gen -Ifirmware/src -o build/emu/native_check web/emu/native_check.c -lm
          build/emu/native_check build/emu/native.f32
          BENCH_MAX=2 node web/emu/emu_test.mjs build/emu/felucca.wasm build/emu/native.f32
          node web/test_firmware_support.mjs
          node web/test_firmware_patch.mjs
          node web/emu/audio_session_test.mjs
      - name: Existing editor regression
        run: |
          cc -O1 -w -Ibuild/gen -Ifirmware/src -o build/remote/editor_test tests/editor_test.c -lm
          build/remote/editor_test
      - name: Current manual screens
        run: |
          cc -O1 -w -Ibuild/gen -Ifirmware/src -o build/remote/manual_shots tests/manual_shots.c -lm
          mkdir -p build/remote/manual
          build/remote/manual_shots build/remote/manual
      - uses: actions/upload-artifact@v4
        with:
          name: paleotone-screen-companion
          path: |
            build/emu/
            !build/emu/native*
            build/emu/remote_screen.js
            build/emu/second_screen.js
            build/emu/control_target.js
            build/emu/physical_focus.js
            build/emu/frame_presenter.js
            build/emu/display_performance.js
            build/emu/remote_views.json
            build/emu/felucca.wasm
            web/REMOTE_SCREEN.md
            build/remote/manual/

  candidate-preview:
    if: github.ref == 'refs/heads/feature/scape-garden'
    needs: companion
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require matching target and full host checks
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/wait_candidate_checks.py
      - uses: actions/download-artifact@v4
        with:
          name: paleotone-screen-companion
          path: build/candidate-companion
      - uses: actions/download-artifact@v4
        with:
          name: paleotone-firmware
          path: build/candidate-firmware
          github-token: ${{ github.token }}
          run-id: ${{ steps.gate.outputs.firmware_run }}
      - name: Stage matched preview and native manual pictures
        run: |
          python3 -m pip install pillow==12.3.0
          python3 - <<'PY'
          import os,subprocess
          from pathlib import Path
          from PIL import Image
          companion=Path('build/candidate-companion')
          emu=next(companion.rglob('felucca.wasm')).parent
          package=next(Path('build/candidate-firmware').rglob('paleotone.fwsc'))
          for name in ('scape_music','scape_mix','scape','scape_setup','scape_roles','scape_drone','scape_life','scape_levels','scape_levels2','scape_scene'):
              path=next(companion.rglob(name+'.ppm'))
              Image.open(path).save(Path('web/manual/img')/(name+'.png'))
          subprocess.run(['python3','web/prepare_scape_preview.py',str(emu),str(package),'build/scape-preview',os.environ['GITHUB_SHA']],check=True)
          PY
          node web/test_scape_preview.mjs build/scape-preview
          node web/test_published_companion.mjs build/scape-preview/screen
          node web/test_control_widget.mjs build/scape-preview/screen/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: paleotone-validated-preview
          path: build/scape-preview/
      - name: Publish isolated candidate preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/ref/heads/feature/scape-garden'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(request,timeout=30) as response:head=json.load(response)['object']['sha']
          assert head==os.environ['GITHUB_SHA'],'Newer source exists; preserve current preview'
          PY
          git fetch origin gh-pages
          git worktree add --detach build/candidate-pages FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('build/candidate-pages').resolve()
          target=(root/'webapp/scape-preview').resolve()
          assert target.relative_to(root).as_posix()=='webapp/scape-preview'
          if target.exists():shutil.rmtree(target)
          shutil.copytree('build/scape-preview',target)
          PY
          git -C build/candidate-pages config user.name github-actions
          git -C build/candidate-pages config user.email github-actions@users.noreply.github.com
          git -C build/candidate-pages add -- webapp/scape-preview
          git -C build/candidate-pages commit -m "Update validated SCAPE preview ${GITHUB_SHA}"
          git -C build/candidate-pages push origin HEAD:gh-pages
