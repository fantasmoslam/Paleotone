# The dino groovebox (a fork of SLOOP Pro 2.8.4, SLOOP on the SMK-37): builds the SMK-37 Elite and FM-1 packages,
# runs the host tests, and puts the packages and the logs on the branch dino-groovebox-output.
name: dino

on:
  push:
    branches: [dino-groovebox]
  workflow_dispatch:

permissions:
  contents: write          # (the dino-groovebox-output branch)

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 75
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip git curl xz-utils ca-certificates libraqm0 gcc libc6-dev make nodejs
          pip3 install --break-system-packages pillow==12.3.0 fonttools==4.61.1

      - uses: actions/checkout@v4

      - name: JieLi toolchain
        run: tools/get_toolchain.sh "$HOME/.jieli"

      - name: JieLi AC79 SDK
        run: git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"

      - name: SMK-37 Elite build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          BOARD=smk37 MODEL=elite ./build.sh 2>&1 | tee out/build-elite.log | tail -15
          cp build/*elite*.fwsc out/
          sha256sum out/*.fwsc | tee out/sha256.txt

      - name: FM-1 build (and the host tests run against it)
        shell: bash
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee out/build-fm1.log | tail -15
          for f in build/*.fwsc; do case "$f" in *elite*|*mke*) ;; *) cp "$f" out/ ;; esac; done
          sha256sum out/*.fwsc | tee out/sha256.txt

      - name: Host tests
        shell: bash
        continue-on-error: true
        run: |
          sh tests/run_tests.sh > out/tests.log 2>&1; echo "exit $?" | tee -a out/tests.log
          grep -E "FAIL|^exit" out/tests.log | tail -60

      - name: Put the result on the dino-groovebox-output branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/o && cp -r out/. /tmp/o/ 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/o/RESULT
          cd /tmp/o && git init -q -b dino-groovebox-output && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "build of ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dino-groovebox-output
