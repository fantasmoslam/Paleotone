# T-WRECKS (on NACHTFAHRT, after DUB-1 and AMB-1): builds the FM-1 package, runs the host tests, and puts the package,
# the logs and the RAM map on the branch twrecks-fm1-output. No releases from here yet.
name: NightClaw FM-1

on:
  push:
    branches: [twrecks, twrecks-controls, twrecks-completion]
  workflow_dispatch:

permissions:
  contents: write          # (the twrecks-fm1-output branch)

jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 75
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip git curl xz-utils ca-certificates libraqm0 gcc libc6-dev make
          pip3 install --break-system-packages pillow==12.3.0 fonttools==4.61.1

      - uses: actions/checkout@v4

      - name: JieLi toolchain
        run: sh tools/get_toolchain.sh "$HOME/.jieli"

      - name: JieLi AC79 SDK
        run: |   # gitee drops the connection now and then: retry
          for i in 1 2 3 4 5; do
            rm -rf "$HOME/fw-AC79_AIoT_SDK"
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK" && exit 0
            sleep $((i * 15))
          done
          exit 1

      - name: FM-1 build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          bash build.sh 2>&1 | tee out/build-fm1.log | tail -15
          cp build/amb.fwsc out/nightclaw-FM-1_942.fwsc
          cp build/amb.dis out/ 2>/dev/null || true
          # the RAM map: every object of 256 bytes or more in .pool, .bss, .lowram, .noinit, biggest first
          for f in build/*.syms; do [ -f "$f" ] && python3 -c 'import re,sys
          rows=[(int(m.group(2),16),m.group(1),m.group(3)) for m in re.finditer(r"\s(\.(?:pool|bss|lowram|noinit)\S*)\s+([0-9a-f]+)\s+(\S+)$",open(sys.argv[1]).read(),re.M)]
          [print("%7d %-12s %s"%r) for r in sorted(rows,reverse=True) if r[0]>=256]' "$f" > out/ram-fm1.txt; done || true
          sha256sum out/*.fwsc | tee out/sha256.txt

      - name: Host tests
        shell: bash
        run: |
          status=0
          AC79_SDK="$HOME/fw-AC79_AIoT_SDK" sh tests/run_tests.sh > out/tests.log 2>&1 || status=$?
          echo "exit $status" | tee -a out/tests.log
          grep -E "FAIL|^exit" out/tests.log | tail -60
          exit "$status"

      - name: Put the result on the twrecks-fm1-output branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/o && cp -r out/. /tmp/o/ 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/o/RESULT
          cd /tmp/o && git init -q -b twrecks-fm1-output && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "build of ${{ github.sha }}"
          if [ "${{ github.ref_name }}" = "twrecks" ]; then
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" twrecks-fm1-output
          else
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:${{ github.ref_name }}-output
          fi
