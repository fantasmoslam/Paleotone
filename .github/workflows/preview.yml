# A preview build of a work branch (danger, saurus2): the FM-1 firmware, its image tests and the render loops' cost on the
# target, put on the branch preview-output-<branch>. Never the website, never build-output (build-firmware.yml: main).
name: preview build

on:
  push:
    branches: [danger, saurus2]
  workflow_dispatch:

permissions:
  contents: write          # (the preview-output-<branch> branch)

jobs:
  firmware:
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 30
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip git curl xz-utils ca-certificates libraqm0   # (Pillow's shaping: tnum)
          pip3 install --break-system-packages pillow==12.3.0 fonttools==4.61.1   # (as host-tests.yml: the same pixels)

      - uses: actions/checkout@v4

      - name: JieLi toolchain
        run: tools/get_toolchain.sh "$HOME/.jieli"

      - name: JieLi AC79 SDK
        run: git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log
          cp build/felucca.fwsc paleotone.fwsc
          sha256sum paleotone.fwsc | tee -a build.log

      - name: Image tests (the update entry, the loader from another app, the render loops' cost)
        shell: bash
        run: |
          set -o pipefail
          export AC79_SDK="$HOME/fw-AC79_AIoT_SDK"
          apt-get install -y --no-install-recommends gcc libc6-dev > /dev/null
          python3 tools/build.py --gen-only > /dev/null
          mkdir -p build/host
          cc -O1 -w -DOWN_PKG=1 -o build/host/ota_test tests/ota_test.c && build/host/ota_test build/felucca.fwsc | tail -1 | tee -a build.log
          head -c 200000 build/felucca.bin > build/host/old_app.bin
          python3 tools/fm1pkg_make.py build/host/old_app.bin build/loader/ota.bin build/host/old.fwsc > /dev/null
          cc -O1 -w -o build/host/ldr_test tests/ldr_test.c && build/host/ldr_test build/host/old.fwsc build/felucca.fwsc | tail -1 | tee -a build.log
          python3 tests/target_budget.py build/felucca.dis tests/target_budget.txt 2>&1 | tee -a build.log || true   # (all of it: a preview)

      - name: Put the result on the build-output branch
        if: always()
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"
          mkdir -p /tmp/out && cp build.log /tmp/out/ 2>/dev/null || echo "no build log" > /tmp/out/build.log
          [ -f paleotone.fwsc ] && cp paleotone.fwsc /tmp/out/ || true
          for f in felucca.bin loader/ota.bin felucca.dis; do [ -f "build/$f" ] && cp "build/$f" /tmp/out/ || true; done   # (the image tests)
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/out/RESULT
          cd /tmp/out && git init -q -b "preview-output-${GITHUB_REF_NAME}" && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "preview build of ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "preview-output-${GITHUB_REF_NAME}"
