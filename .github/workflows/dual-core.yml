name: dual-core validation
on:
  push:
    branches: [feature/paleotone-dualcore, feature/audio-diagnostics, feature/audio-hotpath-inline, feature/effects-hotpath-inline, feature/engine-hotpath-inline, feature/usb-buffer-margin, feature/midi-path-trace, fix/editor-updater-dispatch, feature/roar-worker-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -m pip install pillow==12.3.0 fonttools==4.61.1 numpy==2.5.3
      - run: python3 tools/build.py --gen-only
      - name: MIDI path counter regression
        run: |
          cc -O2 -w tests/midi_trace_test.c -o /tmp/midi-trace
          /tmp/midi-trace
      - name: Audio profiling counter regression
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Ifirmware/src tests/audio_profile_test.c -o /tmp/audio-profile-test
          /tmp/audio-profile-test
      - name: USB queue timing and jitter regression
        run: |
          mkdir -p build/host
          cc -O2 -DT_CDC=1 -DHALF_FRAMES=128 tests/uac_queue_test.c -lm -o build/host/uac-queue
          build/host/uac-queue
          git show 3da5576a9971191eef44d027f2cc1727203eb9f6:firmware/src/usb.c > build/host/baseline_usb.c
          cc -O2 -DT_CDC=1 -DHALF_FRAMES=128 -Ifirmware/src '-DUAC_SOURCE="../build/host/baseline_usb.c"' tests/uac_queue_test.c -lm -o build/host/uac-queue-base
          build/host/uac-queue-base
      - name: Compile and test the real concurrent mixer
        run: |
          mkdir -p build/host
          cc -O2 -w -Ibuild/gen -Ifirmware/src -pthread tests/dualcore_test.c -lm -o build/host/dualcore_test
          build/host/dualcore_test
      - name: ROAR forced-worker control transitions
        run: SCENE='ROAR' build/host/dualcore_test
      - name: Existing sound regression with worker active
        run: |
          cc -O2 -w -DC1_HOST -Ibuild/gen -Ifirmware/src -pthread tests/regress.c -lm -o build/host/regress-c1
          build/host/regress-c1
      - name: Concurrent memory-access checks
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          cc -O1 -g -w -fsanitize=thread -fno-omit-frame-pointer -Ibuild/gen -Ifirmware/src -pthread tests/dualcore_test.c -lm -o build/host/dualcore-tsan
          TSAN_OPTIONS=halt_on_error=1 build/host/dualcore-tsan
      - name: All existing single-core checks
        run: HOST_ONLY=1 tests/run_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-core-host-reports
          path: |
            build/ui_new/report.txt
            build/ui_fm4/report.txt
