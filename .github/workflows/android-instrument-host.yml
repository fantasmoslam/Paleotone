name: Android instrument host prototype
on:
  workflow_dispatch:
  push:
    branches: [codex/android-instrument-host]
    paths: ['host/**', 'firmware/**', 'web/emu/**', '.github/workflows/android-instrument-host.yml']
permissions:
  contents: read
concurrency:
  group: android-host-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pillow==12.3.0 fonttools==4.61.1 numpy==2.3.5
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.31.6'
      - name: Prepare pinned comparison host
        run: python3 host/prepare_remote.py --out build/instrument-host/RemoteFM1Android
      - name: Compile project-owned Android interface
        run: |
          python3 host/apply_android_ui.py --remote build/instrument-host/RemoteFM1Android
          cd build/instrument-host/RemoteFM1Android
          bash gradlew :app:compileDebugKotlin -PrfmSkipCores=true --no-daemon --max-workers=2
      - name: Build and test both real applications on desktop
        run: |
          cmake -S host -B build/instrument-host/desktop -DCMAKE_BUILD_TYPE=Release \
            -DFM1VST_DIR="$PWD/build/instrument-host/RemoteFM1Android/vendor/FM1VST" \
            -DREMOTE_ANDROID_DIR="$PWD/build/instrument-host/RemoteFM1Android"
          cmake --build build/instrument-host/desktop --target paleotone_core felucca_core host_core_integration host_audio_fidelity host_preset_audition host_screen_fixture -j 2
          ctest --test-dir build/instrument-host/desktop --output-on-failure
      - name: Render real Paleotone display fixture
        run: |
          build/instrument-host/desktop/host_screen_fixture build/instrument-host/display.rgb565
          mkdir -p build/instrument-host/RemoteFM1Android/app/src/debug/assets
          python3 - <<'PY'
          import numpy as np
          from PIL import Image
          p=np.fromfile('build/instrument-host/display.rgb565',dtype='>u2').reshape(240,240)
          rgb=np.stack([((p>>11)&31)*255//31,((p>>5)&63)*255//63,(p&31)*255//31],axis=-1).astype('uint8')
          Image.fromarray(rgb).save('build/instrument-host/RemoteFM1Android/app/src/debug/assets/layout-paleotone.png')
          PY
      - name: Build isolated two-instrument Android prototype
        run: python3 host/build_android.py --remote build/instrument-host/RemoteFM1Android --jobs 2
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Render and verify tablet layouts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash host/render_layouts.sh "$PWD/build/instrument-host/RemoteFM1Android" "$PWD/build/instrument-host/layout-review"
      - name: Corresponding prototype source
        run: git archive --format=zip --output=build/instrument-host/release/Prototype-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-Instrument-Host-Prototype
          path: |
            build/instrument-host/release/*
            build/instrument-host/layout-review/**
            build/instrument-host/desktop/Testing/Temporary/LastTest.log
            build/instrument-host/RemoteFM1Android/app/build/test-results/testDebugUnitTest/*.xml
          retention-days: 30
