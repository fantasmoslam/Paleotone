name: Biome generator audition
on:
  push:
    branches: [codex/scape-resource-audition]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python3 -m pip install pillow==12.3.0 fonttools==4.61.1 numpy==2.5.3 imageio-ffmpeg==0.6.0
      - run: python3 tools/build.py --gen-only
      - name: Render the experimental generator through the current firmware mixer
        run: |
          mkdir -p build/host build/scape
          cc -O2 -w -Ibuild/gen -Ifirmware/src tests/scape_preview.c -lm -o build/host/scape_preview
          python3 tools/scape_preview.py
          cp firmware/src/scape.c /tmp/scape-new.c
          git show f99e45b3111c6a57968cf82a698ad693591e975c:firmware/src/scape.c > firmware/src/scape.c
          cc -O2 -w -Ibuild/gen -Ifirmware/src tests/scape_preview.c -lm -o build/host/scape-before
          cp /tmp/scape-new.c firmware/src/scape.c
          build/host/scape-before build/scape/quiet-before.wav 12 1 3 0 0 0 1
          build/host/scape_preview build/scape/quiet-after.wav 12 1 3 0 0 0 1
          cmp build/scape/quiet-before.wav build/scape/quiet-after.wav
          build/host/scape-before build/scape/foot-before.wav 32 1 3 0 110 0 1 6 | tee build/scape/footsteps-metrics.txt
          build/host/scape_preview build/scape/foot-after.wav 32 1 3 0 110 0 1 6 | tee -a build/scape/footsteps-metrics.txt
          SCAPE_NOCALLS=1 build/host/scape-before build/scape/foot-nocalls-before.wav 32 1 3 0 110 0 1 6 | tee -a build/scape/footsteps-metrics.txt
          SCAPE_NOCALLS=1 build/host/scape_preview build/scape/foot-nocalls-after.wav 32 1 3 0 110 0 1 6 | tee -a build/scape/footsteps-metrics.txt
          python3 - <<'PY'
          import wave, subprocess, imageio_ffmpeg
          from pathlib import Path
          import numpy as np
          root = Path('build/scape')
          names = ['foot-before', 'foot-after', 'foot-nocalls-before', 'foot-nocalls-after']
          parts = []
          for name in names:
              with wave.open(str(root / (name + '.wav'))) as f:
                  x = np.frombuffer(f.readframes(f.getnframes()), '<i2').reshape(-1,2).astype(float)
              if not np.isfinite(x).all() or np.max(np.abs(x)) >= 32767:
                  raise SystemExit('Invalid/clipped rendered PCM: ' + name)
              n=len(x)
              fade=np.minimum(1,np.minimum(np.arange(n)/44100,(n-np.arange(n))/44100))
              parts.extend([x*fade[:,None],np.zeros((66150,2))])
          y=np.concatenate(parts)
          with wave.open(str(root/'footsteps-ab.wav'),'wb') as f:
              f.setnchannels(2); f.setsampwidth(2); f.setframerate(44100)
              f.writeframes(y.astype('<i2').tobytes())
          subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(),'-y','-i',str(root/'footsteps-ab.wav'),'-b:a','128k',str(root/'footsteps-ab.mp3')],check=True)
          (root/'footsteps-cues.txt').write_text('0:00 Original high-danger encounter\n0:33 Revised heavy approach\n1:07 Original without creature calls\n1:40 Revised without creature calls\nNo normalization; identical gain. Quiet DANGER 0 render was byte-identical.\n')
          PY
          for biome in 0 1 2 3 4 5 6 7; do
            echo "Biome $biome host cost (relative timing, not target CPU)"
            SCAPE_COST=1 build/host/scape_preview /dev/null 30 "$biome" 2 3 127
          done | tee build/scape/host-cost.txt
      - uses: actions/upload-artifact@v4
        with:
          name: biome-generator-audition
          path: |
            build/scape/dinobox_scape_preview.mp3
            build/scape/cues.txt
            build/scape/host-cost.txt
            build/scape/footsteps*
      - name: Save audition for connected download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/scape-output
          cp build/scape/dinobox_scape_preview.mp3 build/scape/cues.txt build/scape/host-cost.txt build/scape/footsteps-ab.mp3 build/scape/footsteps-cues.txt build/scape/footsteps-metrics.txt /tmp/scape-output/
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data = Path('/tmp/scape-output/dinobox_scape_preview.mp3').read_bytes()
          for i, at in enumerate(range(0, len(data), 500000)):
              Path(f'/tmp/scape-output/audio-part-{i:02d}.b64').write_text(base64.b64encode(data[at:at+500000]).decode() + '\n')
          PY
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data=Path('/tmp/scape-output/footsteps-ab.mp3').read_bytes()
          for i,at in enumerate(range(0,len(data),500000)):
              Path(f'/tmp/scape-output/footsteps-part-{i:02d}.b64').write_text(base64.b64encode(data[at:at+500000]).decode()+'\n')
          PY
          sha256sum /tmp/scape-output/footsteps-ab.mp3 > /tmp/scape-output/FOOTSTEPS_SHA256
          printf '%s\n' "$GITHUB_SHA" > /tmp/scape-output/SOURCE
          sha256sum /tmp/scape-output/dinobox_scape_preview.mp3 > /tmp/scape-output/SHA256
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin scape-audition-output
          git checkout -B scape-audition-output FETCH_HEAD
          git rm -rf .
          cp /tmp/scape-output/* .
          git add .
          git commit -m "Biome audition from $GITHUB_SHA"
          git push origin HEAD:refs/heads/scape-audition-output
