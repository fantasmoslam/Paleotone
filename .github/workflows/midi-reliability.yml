name: MIDI output reliability
on:
  push:
    branches: [codex/midi-output-recovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -m pip install pillow==12.3.0 fonttools==4.61.1 numpy==2.5.3
      - run: python3 tools/build.py --gen-only
      - name: Reproduce dropped note-off on installed source, then test recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/host
          cp firmware/src/usb.c build/usb.fixed.c
          cp firmware/src/seq.c build/seq.fixed.c
          trap 'cp build/usb.fixed.c firmware/src/usb.c; cp build/seq.fixed.c firmware/src/seq.c' EXIT
          git show 81e2f1bfabdec7a63c878d0b4004a0f1489504d5:firmware/src/usb.c > firmware/src/usb.c
          git show 81e2f1bfabdec7a63c878d0b4004a0f1489504d5:firmware/src/seq.c > firmware/src/seq.c
          cc -O1 -w -Ibuild/gen -Ifirmware/src tests/midi_control_test.c -lm -o build/host/midi-before
          if build/host/midi-before > build/midi-before.txt; then
            echo 'Expected congestion regression was not reproduced'; exit 1
          fi
          grep 'MIDI congestion:.*FAIL' build/midi-before.txt
          cp build/usb.fixed.c firmware/src/usb.c
          cp build/seq.fixed.c firmware/src/seq.c
          cc -O1 -w -Ibuild/gen -Ifirmware/src tests/midi_control_test.c -lm -o build/host/midi-after
          build/host/midi-after | tee build/midi-after.txt
      - name: Full host suite
        run: set -o pipefail; HOST_ONLY=1 tests/run_tests.sh | tee build/host-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: midi-reliability-results
          path: |
            build/midi-before.txt
            build/midi-after.txt
            build/host-results.txt
  firmware:
    runs-on: ubuntu-24.04
    container: debian:bookworm-slim
    timeout-minutes: 30
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip git curl xz-utils ca-certificates libraqm0   # (Pillow's shaping: tnum)
          pip3 install --break-system-packages pillow==12.3.0 fonttools==4.61.1   # (as host-tests.yml: the same pixels)

      - uses: actions/checkout@v4

      - name: JieLi toolchain
        run: tools/get_toolchain.sh "$HOME/.jieli"

      - name: JieLi AC79 SDK
        run: git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log
          cp build/felucca.fwsc dinobox.fwsc
          sha256sum dinobox.fwsc | tee -a build.log

      - name: Image tests (the update entry, the loader from another app, the render loops' cost)
        shell: bash
        run: |
          set -eo pipefail
          export AC79_SDK="$HOME/fw-AC79_AIoT_SDK"
          apt-get install -y --no-install-recommends gcc libc6-dev > /dev/null
          python3 tools/build.py --gen-only > /dev/null
          mkdir -p build/host
          cc -O1 -w -DOWN_PKG=1 -o build/host/ota_test tests/ota_test.c && build/host/ota_test build/felucca.fwsc | tail -1 | tee -a build.log
          head -c 200000 build/felucca.bin > build/host/old_app.bin
          python3 tools/fm1pkg_make.py build/host/old_app.bin build/loader/ota.bin build/host/old.fwsc > /dev/null
          cc -O1 -w -o build/host/ldr_test tests/ldr_test.c && build/host/ldr_test build/host/old.fwsc build/felucca.fwsc | tail -1 | tee -a build.log
          python3 tests/target_budget.py build/felucca.dis tests/target_budget.txt | tail -1 | tee -a build.log

      - uses: actions/upload-artifact@v4
        with:
          name: dinobox-firmware
          path: |
            dinobox.fwsc
            build.log
            build/felucca.dis
          if-no-files-found: error



